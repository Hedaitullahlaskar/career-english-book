name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: connect and list what would change, but upload nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-hostinger-career-english-book
  cancel-in-progress: false

jobs:
  deploy:
    # Pushes only deploy once the repository variable DEPLOY_ENABLED is "true".
    # Manual runs (workflow_dispatch) are always allowed and default to a dry run.
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload site via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          exclude: |
            **/.git*
            **/.git*/**
            .git/**
            .github/**
            README.md
            .gitignore
